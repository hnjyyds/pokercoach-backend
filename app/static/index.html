<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PokerCoach</title>
  <style>
    :root {
      --canvas: #f6f4ee;
      --paper: #fffdfa;
      --paper-2: #f0eee7;
      --ink: #171a1f;
      --muted: #66717d;
      --faint: #98a2ad;
      --felt: #0b6f5e;
      --felt-2: #064f45;
      --blue: #365a9d;
      --amber: #c1842d;
      --red: #c9493d;
      --line: rgba(23, 26, 31, 0.1);
      --shadow: 0 22px 60px rgba(23, 26, 31, 0.18);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        linear-gradient(145deg, rgba(11, 111, 94, 0.08), transparent 28%),
        linear-gradient(315deg, rgba(54, 90, 157, 0.08), transparent 34%),
        var(--canvas);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .workspace {
      min-height: 100vh;
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(360px, 430px) 1fr;
      gap: 32px;
      align-items: center;
    }

    .device {
      position: relative;
      width: min(100%, 414px);
      height: min(860px, calc(100vh - 56px));
      min-height: 690px;
      margin: 0 auto;
      padding: 10px;
      border-radius: 36px;
      background: #111317;
      box-shadow: var(--shadow);
    }

    .device::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      width: 112px;
      height: 24px;
      transform: translateX(-50%);
      border-radius: 0 0 18px 18px;
      background: #111317;
      z-index: 4;
    }

    .app {
      position: relative;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 28px;
      background: var(--canvas);
    }

    .screen {
      flex: 1;
      overflow: auto;
      padding: 30px 18px 18px;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar { display: none; }

    .tabbar {
      height: 72px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(255, 253, 250, 0.92);
      backdrop-filter: blur(20px);
    }

    .tabbar button {
      border: 0;
      background: transparent;
      color: var(--faint);
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
    }

    .tabbar button span {
      display: block;
      margin-bottom: 4px;
      font-size: 20px;
      line-height: 1;
    }

    .tabbar button.active { color: var(--felt); }

    .hidden { display: none !important; }

    .stack { display: grid; gap: 14px; }
    .stack-lg { display: grid; gap: 20px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row-between > * { min-width: 0; }

    h1,
    h2,
    h3,
    p { margin: 0; }

    h1 {
      font-size: 34px;
      line-height: 1.02;
      letter-spacing: 0;
    }

    h2 {
      font-size: 27px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    h3 {
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .eyebrow {
      color: var(--felt);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: white;
      background:
        radial-gradient(circle at 28% 20%, rgba(255, 255, 255, 0.26), transparent 30%),
        linear-gradient(145deg, var(--felt), var(--felt-2));
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(11, 111, 94, 0.28);
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 12px 30px rgba(23, 26, 31, 0.06);
    }

    .pad { padding: 16px; }

    .hero-panel {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border-radius: 8px;
      color: white;
      background:
        radial-gradient(circle at 82% 4%, rgba(255, 255, 255, 0.24), transparent 22%),
        linear-gradient(145deg, #0d8069, #06473f);
      box-shadow: 0 18px 44px rgba(11, 111, 94, 0.24);
    }

    .hero-panel::after {
      content: "";
      position: absolute;
      right: -34px;
      bottom: -46px;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      transform: rotate(17deg);
    }

    .hero-panel > * { position: relative; z-index: 1; }

    .hero-kpi {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(#fff 0 42%, rgba(255, 255, 255, 0.22) 42% 100%);
    }

    .hero-kpi span {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #0b6759;
      font-weight: 900;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      min-height: 98px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .metric-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      margin-bottom: 9px;
      color: white;
      background: var(--ink);
      font-size: 15px;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 900;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 26, 31, 0.08);
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--felt), var(--blue));
    }

    .module-row {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .module-row > .stack { min-width: 0; }
    .module-row .muted {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--felt);
      background: rgba(11, 111, 94, 0.1);
      font-weight: 900;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill {
      padding: 6px 9px;
      border-radius: 999px;
      color: var(--felt);
      background: rgba(11, 111, 94, 0.1);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill.amber {
      color: var(--amber);
      background: rgba(193, 132, 45, 0.13);
    }

    .pill.red {
      color: var(--red);
      background: rgba(201, 73, 61, 0.12);
    }

    .pill.blue {
      color: var(--blue);
      background: rgba(54, 90, 157, 0.11);
    }

    .btn {
      min-height: 50px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--felt);
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(11, 111, 94, 0.2);
    }

    .btn.secondary {
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.small {
      width: auto;
      min-height: 38px;
      padding: 0 13px;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 8px;
      background: rgba(23, 26, 31, 0.07);
    }

    .segmented button {
      height: 38px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-weight: 850;
      cursor: pointer;
    }

    .segmented button.active {
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 2px 8px rgba(23, 26, 31, 0.12);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--felt);
      box-shadow: 0 0 0 4px rgba(11, 111, 94, 0.1);
    }

    .toast {
      min-height: 18px;
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
    }

    .scenario-table {
      position: relative;
      overflow: hidden;
      padding: 16px;
      border-radius: 8px;
      color: white;
      background:
        radial-gradient(ellipse at center, rgba(255, 255, 255, 0.12), transparent 55%),
        linear-gradient(145deg, #0e7d68, #064b42);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .scenario-table::before {
      content: "";
      position: absolute;
      inset: 16px 22px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .hand {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 14px;
    }

    .card-face {
      width: 72px;
      height: 96px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.22);
      font-size: 24px;
      font-weight: 950;
      transform: rotate(-4deg);
    }

    .card-face + .card-face {
      transform: rotate(4deg);
    }

    .choice {
      width: 100%;
      min-height: 66px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--paper);
      cursor: pointer;
      text-align: left;
    }

    .choice.active {
      border-color: var(--felt);
      background: rgba(11, 111, 94, 0.1);
      box-shadow: 0 0 0 3px rgba(11, 111, 94, 0.08);
    }

    .choice strong { display: block; margin-bottom: 3px; }

    .result-card {
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(11, 111, 94, 0.22);
      background: linear-gradient(145deg, rgba(11, 111, 94, 0.1), rgba(54, 90, 157, 0.08));
    }

    .insight-list {
      display: grid;
      gap: 10px;
    }

    .insight {
      display: grid;
      grid-template-columns: 8px 1fr;
      gap: 10px;
      align-items: start;
    }

    .dot {
      width: 7px;
      height: 7px;
      margin-top: 7px;
      border-radius: 50%;
      background: var(--amber);
    }

    .side {
      display: grid;
      gap: 16px;
      align-content: center;
    }

    .side-hero {
      padding: 22px;
      border-radius: 8px;
      color: white;
      background:
        radial-gradient(circle at 85% 8%, rgba(255, 255, 255, 0.22), transparent 24%),
        linear-gradient(145deg, #171a1f, #102c36 46%, #0b6f5e);
      box-shadow: var(--shadow);
    }

    .side-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 250, 0.72);
      backdrop-filter: blur(22px);
    }

    .side-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .side-stat {
      padding: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }

    .side-stat strong {
      display: block;
      margin-top: 5px;
      font-size: 23px;
    }

    @media (max-width: 900px) {
      .workspace {
        display: block;
        padding: 14px;
      }

      .device {
        width: min(430px, calc(100vw - 28px));
        height: calc(100vh - 28px);
        min-height: 640px;
      }

      .side { display: none; }
    }

    @media (max-width: 520px) {
      .workspace {
        width: 100%;
        min-height: 100vh;
        padding: 0;
      }

      .device {
        width: 100vw;
        height: 100vh;
        min-height: 640px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .device::before { display: none; }

      .app { border-radius: 0; }

      .screen { padding: 18px 16px 16px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="device" aria-label="PokerCoach app preview">
      <div class="app">
        <div class="screen" id="screen"></div>
        <nav class="tabbar hidden" id="tabbar">
          <button data-tab="home" class="active"><span>◎</span>训练</button>
          <button data-tab="training"><span>◫</span>题库</button>
          <button data-tab="tools"><span>%</span>工具</button>
          <button data-tab="profile"><span>◌</span>我的</button>
        </nav>
      </div>
    </section>

    <aside class="side">
      <div class="side-hero stack-lg">
        <div class="brand-lockup">
          <div class="logo">♠</div>
          <div>
            <p class="eyebrow" style="color:#9ee7d6">PokerCoach</p>
            <h1>把牌桌决策练成肌肉记忆</h1>
          </div>
        </div>
        <p style="color:rgba(255,255,255,.74);line-height:1.6">产品方向改成克制、原生、训练感。扑克元素保留在材质和交互里，不走赌场风。</p>
        <div class="side-grid">
          <div class="side-stat"><span style="color:rgba(255,255,255,.68)">MVP 模块</span><strong>4</strong></div>
          <div class="side-stat"><span style="color:rgba(255,255,255,.68)">今日训练</span><strong>10m</strong></div>
        </div>
      </div>
      <div class="side-card stack">
        <h3>这版可以直接看产品体验</h3>
        <p class="muted">登录、首页、情景题、赔率工具和个人页都仍然走 FastAPI mock 接口。</p>
      </div>
    </aside>
  </main>

  <script>
    const api = "";
    const state = {
      token: "",
      user: null,
      dashboard: null,
      scenarios: [],
      scenarioIndex: 0,
      selectedAction: "",
      result: null,
      activeTab: "home",
      authMode: "login"
    };

    const screen = document.querySelector("#screen");
    const tabbar = document.querySelector("#tabbar");

    document.querySelectorAll("[data-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        state.activeTab = button.dataset.tab;
        state.selectedAction = "";
        state.result = null;
        renderApp();
      });
    });

    function template(strings, ...values) {
      return strings.reduce((out, part, index) => out + part + (values[index] ?? ""), "");
    }

    async function request(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const response = await fetch(api + path, { ...options, headers });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function signIn(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const payload = state.authMode === "register"
        ? { name: form.get("name"), email: form.get("email"), password: form.get("password") }
        : { email: form.get("email"), password: form.get("password") };
      const path = state.authMode === "register" ? "/auth/register" : "/auth/login";
      setToast("");

      try {
        const data = await request(path, { method: "POST", body: JSON.stringify(payload) });
        state.token = data.token;
        state.user = data.user;
        await loadData();
        state.activeTab = requestedTab() || "home";
        renderApp();
      } catch {
        setToast("登录失败，请确认后端服务正在运行。");
      }
    }

    async function loadData() {
      const [dashboard, scenarios] = await Promise.all([
        request("/dashboard"),
        request("/training/preflop")
      ]);
      state.dashboard = dashboard;
      state.scenarios = scenarios;
    }

    async function submitScenario() {
      const scenario = state.scenarios[state.scenarioIndex];
      if (!scenario || !state.selectedAction) return;
      state.result = await request(`/training/preflop/${scenario.id}/answer`, {
        method: "POST",
        body: JSON.stringify({ action: state.selectedAction })
      });
      renderTraining();
    }

    async function calculateOdds(event) {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const data = await request("/tools/odds", {
        method: "POST",
        body: JSON.stringify({
          hero_hand: form.get("heroHand"),
          board: form.get("board"),
          outs: Number(form.get("outs"))
        })
      });
      document.querySelector("#odds-result").innerHTML = template`
        <div class="card pad stack">
          <div class="metric-grid">
            <div class="metric">
              <div class="metric-icon" style="background:var(--amber)">↓</div>
              <span class="muted">下一张</span>
              <strong>${formatPercent(data.turn_or_river_probability)}</strong>
            </div>
            <div class="metric">
              <div class="metric-icon" style="background:var(--felt)">≈</div>
              <span class="muted">到河牌</span>
              <strong>${formatPercent(data.by_river_probability)}</strong>
            </div>
          </div>
          <p class="muted">${data.coaching_note}</p>
        </div>
      `;
    }

    function formatPercent(value) {
      return `${Math.round(value * 100)}%`;
    }

    function renderAuth() {
      tabbar.classList.add("hidden");
      screen.innerHTML = template`
        <div class="stack-lg">
          <div class="brand-lockup">
            <div class="logo">♠</div>
            <div>
              <p class="eyebrow">PokerCoach</p>
              <h1>德州扑克训练</h1>
            </div>
          </div>

          <div class="hero-panel stack">
            <p class="eyebrow" style="color:rgba(255,255,255,.78)">Daily drill</p>
            <h2>每天 10 分钟，少犯一个昂贵错误。</h2>
            <div class="pill-row">
              <span class="pill" style="color:white;background:rgba(255,255,255,.18)">翻前范围</span>
              <span class="pill" style="color:white;background:rgba(255,255,255,.18)">牌力识别</span>
              <span class="pill" style="color:white;background:rgba(255,255,255,.18)">赔率估算</span>
            </div>
          </div>

          <form class="card pad stack" id="auth-form">
            <div class="segmented">
              <button type="button" data-auth="login" class="${state.authMode === "login" ? "active" : ""}">登录</button>
              <button type="button" data-auth="register" class="${state.authMode === "register" ? "active" : ""}">注册</button>
            </div>
            ${state.authMode === "register" ? `<label>昵称<input name="name" value="Alex" autocomplete="name" /></label>` : ""}
            <label>邮箱<input name="email" type="email" value="alex@example.com" autocomplete="email" /></label>
            <label>密码<input name="password" type="password" value="password" autocomplete="current-password" /></label>
            <div class="toast" id="toast"></div>
            <button class="btn" type="submit">${state.authMode === "login" ? "进入训练" : "创建账号"}</button>
          </form>

          <button class="btn secondary" id="demo-login">使用 Demo 账号</button>
        </div>
      `;

      document.querySelector("#auth-form").addEventListener("submit", signIn);
      document.querySelectorAll("[data-auth]").forEach((button) => {
        button.addEventListener("click", () => {
          state.authMode = button.dataset.auth;
          renderAuth();
        });
      });
      document.querySelector("#demo-login").addEventListener("click", () => {
        document.querySelector("#auth-form").requestSubmit();
      });
    }

    function setToast(message) {
      const toast = document.querySelector("#toast");
      if (toast) toast.textContent = message;
    }

    function requestedTab() {
      const tab = new URLSearchParams(window.location.search).get("tab");
      return ["home", "training", "tools", "profile"].includes(tab) ? tab : "";
    }

    function renderApp() {
      tabbar.classList.remove("hidden");
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.activeTab);
      });

      if (state.activeTab === "home") renderHome();
      if (state.activeTab === "training") renderTraining();
      if (state.activeTab === "tools") renderTools();
      if (state.activeTab === "profile") renderProfile();
    }

    function renderHome() {
      const d = state.dashboard;
      screen.innerHTML = template`
        <div class="stack-lg">
          <div class="row-between">
            <div>
              <p class="eyebrow">今日训练</p>
              <h2>Hi, ${state.user?.name ?? "Player"}</h2>
            </div>
            <div class="logo" style="width:44px;height:44px;font-size:18px">♣</div>
          </div>

          <div class="hero-panel">
            <div class="row-between">
              <div class="stack" style="gap:8px;max-width:210px">
                <h3>${d.daily_plan.title}</h3>
                <p style="color:rgba(255,255,255,.76);line-height:1.45">${d.daily_plan.focus}</p>
              </div>
              <div class="hero-kpi"><span>${d.daily_plan.completed_minutes}/${d.daily_plan.target_minutes}</span></div>
            </div>
          </div>

          <div class="metric-grid">
            <div class="metric">
              <div class="metric-icon" style="background:var(--red)">⌁</div>
              <span class="muted">连续训练</span>
              <strong>${d.user.streak_days} 天</strong>
            </div>
            <div class="metric">
              <div class="metric-icon" style="background:var(--blue)">↗</div>
              <span class="muted">技能分</span>
              <strong>${d.user.skill_score}</strong>
            </div>
          </div>

          <section class="stack">
            <div class="row-between">
              <h3>模块进度</h3>
              <span class="muted">本周</span>
            </div>
            ${d.daily_plan.modules.map((module, index) => `
              <div class="module-row">
                <div class="module-icon">${["◎", "♣", "%"][index] ?? "•"}</div>
                <div class="stack" style="gap:7px">
                  <div class="row-between">
                    <strong>${module.title}</strong>
                    <span class="muted">${module.subtitle}</span>
                  </div>
                  <div class="progress"><span style="width:${module.progress * 100}%"></span></div>
                </div>
                <strong>${Math.round(module.progress * 100)}%</strong>
              </div>
            `).join("")}
          </section>

          <section class="card pad stack">
            <h3>最近错题</h3>
            <div class="insight-list">
              ${d.recent_mistakes.map((item) => `<div class="insight"><span class="dot"></span><p class="muted">${item}</p></div>`).join("")}
            </div>
          </section>
        </div>
      `;
    }

    function renderTraining() {
      const scenario = state.scenarios[state.scenarioIndex];
      if (!scenario) {
        screen.innerHTML = `<div class="card pad"><p class="muted">暂无题目</p></div>`;
        return;
      }

      screen.innerHTML = template`
        <div class="stack-lg">
          <div class="row-between">
            <div>
              <p class="eyebrow">Preflop drill</p>
              <h2>翻前情景题</h2>
            </div>
            <span class="pill blue">${state.scenarioIndex + 1}/${state.scenarios.length}</span>
          </div>

          <div class="scenario-table">
            <div class="row-between" style="position:relative;z-index:1">
              <span class="pill" style="color:white;background:rgba(255,255,255,.18)">${scenario.position}</span>
              <span class="pill" style="color:white;background:rgba(255,255,255,.18)">${scenario.stack_depth_bb}BB</span>
            </div>
            <div class="hand">${renderHand(scenario.hand)}</div>
            <p style="position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.82)">${scenario.table_state}</p>
          </div>

          <section class="stack">
            <div class="row-between">
              <h3>你的行动</h3>
              <span class="muted">底池 ${scenario.pot_bb}BB</span>
            </div>
            ${scenario.choices.map((choice) => `
              <button class="choice ${state.selectedAction === choice.action ? "active" : ""}" data-action="${choice.action}">
                <div class="row-between">
                  <div>
                    <strong>${choice.label}</strong>
                    <span class="muted">${choice.sizing ?? "标准动作"}</span>
                  </div>
                  <span>${state.selectedAction === choice.action ? "✓" : ""}</span>
                </div>
              </button>
            `).join("")}
            <button class="btn" id="submit-answer" ${state.selectedAction ? "" : "disabled"}>提交答案</button>
          </section>

          <div id="result-panel">${state.result ? renderResult(state.result) : ""}</div>

          <div class="row">
            <button class="btn secondary small" id="prev">上一题</button>
            <button class="btn secondary small" id="next">下一题</button>
          </div>
        </div>
      `;

      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedAction = button.dataset.action;
          state.result = null;
          renderTraining();
        });
      });
      document.querySelector("#submit-answer").addEventListener("click", submitScenario);
      document.querySelector("#prev").addEventListener("click", () => moveScenario(-1));
      document.querySelector("#next").addEventListener("click", () => moveScenario(1));
    }

    function renderHand(hand) {
      const first = hand.slice(0, 1);
      const second = hand.slice(1, 2);
      const suited = hand.toLowerCase().includes("s");
      return `
        <div class="card-face">${first}${suited ? "♠" : "♦"}</div>
        <div class="card-face">${second}${suited ? "♠" : "♥"}</div>
      `;
    }

    function renderResult(result) {
      return template`
        <div class="result-card stack">
          <div class="row-between">
            <h3 style="color:${result.is_correct ? "var(--felt)" : "var(--amber)"}">${result.is_correct ? "决策正确" : "建议复盘"}</h3>
            <span class="pill ${result.is_correct ? "" : "amber"}">${result.recommendation}</span>
          </div>
          <p class="muted">${result.explanation}</p>
          <div class="pill-row">${result.concept_tags.map((tag) => `<span class="pill">${tag}</span>`).join("")}</div>
          <p class="muted">${result.next_prompt}</p>
        </div>
      `;
    }

    function moveScenario(delta) {
      state.scenarioIndex = (state.scenarioIndex + delta + state.scenarios.length) % state.scenarios.length;
      state.selectedAction = "";
      state.result = null;
      renderTraining();
    }

    function renderTools() {
      screen.innerHTML = template`
        <div class="stack-lg">
          <div>
            <p class="eyebrow">Odds tool</p>
            <h2>赔率工具</h2>
            <p class="muted">用 outs 快速估算补牌概率，适合新手训练直觉。</p>
          </div>
          <form class="card pad stack" id="odds-form">
            <label>手牌<input name="heroHand" placeholder="输入手牌" /></label>
            <label>公共牌<input name="board" placeholder="输入公共牌" /></label>
            <label>Outs<input name="outs" type="number" min="0" max="20" value="9" /></label>
            <button class="btn">计算概率</button>
          </form>
          <div id="odds-result"></div>
        </div>
      `;
      document.querySelector("#odds-form").addEventListener("submit", calculateOdds);
    }

    function renderProfile() {
      screen.innerHTML = template`
        <div class="stack-lg">
          <div class="card pad row">
            <div class="logo">${state.user?.name?.slice(0, 1) ?? "P"}</div>
            <div>
              <h3>${state.user?.name ?? "Player"}</h3>
              <p class="muted">${state.user?.level ?? "新手入门"}</p>
              <p class="muted">${state.user?.email ?? ""}</p>
            </div>
          </div>
          <div class="hero-panel stack">
            <p class="eyebrow" style="color:rgba(255,255,255,.78)">Pro plan</p>
            <h3>高级范围表、错题复盘、专题训练</h3>
            <p style="color:rgba(255,255,255,.74);line-height:1.5">下一版接入订阅与真实题库权限。</p>
          </div>
          <div class="card pad stack">
            <div class="row-between"><strong>训练提醒</strong><span class="muted">20:30</span></div>
            <div class="row-between"><strong>数据模式</strong><span class="muted">API Mock</span></div>
            <div class="row-between"><strong>隐私</strong><span class="muted">本地优先</span></div>
          </div>
          <button class="btn secondary" id="logout">退出登录</button>
        </div>
      `;
      document.querySelector("#logout").addEventListener("click", () => {
        state.token = "";
        state.user = null;
        state.dashboard = null;
        renderAuth();
      });
    }

    renderAuth();
    if (new URLSearchParams(window.location.search).get("demo") === "1") {
      window.setTimeout(() => {
        const form = document.querySelector("#auth-form");
        if (form) form.requestSubmit();
      }, 80);
    }
  </script>
</body>
</html>
